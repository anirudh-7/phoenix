[project]
name = "phoenix-core"
version = "0.1.0"
description = "Phoenix core: orchestrator, policy engine, agent registry."
requires-python = ">=3.12"
dependencies = [
  # Web framework
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  # Database
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "psycopg[binary]>=3.2.3",
  "alembic>=1.13.3",
  # Config
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  # HTTP + resilience
  "httpx>=0.27.2",
  "tenacity>=9.0.0",
  # Logging
  "structlog>=24.4.0",
  # Agent framework — using Anthropic's SDK directly for v1.
  # We'll migrate to the Claude Agent SDK once its Python package stabilizes.
  "anthropic>=0.39.0",
]

[dependency-groups]
dev = [
  "ruff>=0.7.0",
  "mypy>=1.13.0",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "types-pyyaml>=6.0.12",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phoenix"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line-length enforced by formatter

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
